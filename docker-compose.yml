services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      
  serv_auth:
    build:
      context: .
      dockerfile: srv_auth/Dockerfile
    ports:
      - "8001:8001"